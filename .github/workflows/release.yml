name: Release

# Creates a tag and a GitHub release with the extension zip whenever a new
# version (extension.json) lands on main. Nothing happens when the tag exists.
on:
  push:
    branches: [main]
    paths:
      - extension.json
    # Pushing a version tag (for example 1.3.0) builds the release for that tag.
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read version
        id: version
        run: |
          version=$(node -p "require('./extension.json').version")
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version in extension.json: $version"
            exit 1
          fi
          package_version=$(node -p "require('./package.json').version")
          if [ "$version" != "$package_version" ]; then
            echo "::error::extension.json ($version) and package.json ($package_version) versions differ"
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "$version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match the extension.json version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Skip if the release exists
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "Release ${{ steps.version.outputs.version }} already exists."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.exists.outputs.exists == 'false'
        with:
          node-version: 20
          cache: npm

      - name: Build extension package
        if: steps.exists.outputs.exists == 'false'
        run: |
          npm ci --ignore-scripts
          node build --extension
          test -f "build/mc-pwa-${{ steps.version.outputs.version }}.zip"

      - name: Create tag and release
        if: steps.exists.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.version }}" \
            "build/mc-pwa-${{ steps.version.outputs.version }}.zip" \
            --target "${{ github.sha }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --generate-notes
