version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # The ext-template build pins @babel/core 7; Babel 8 plugins fail npm ci (ERESOLVE).
      - dependency-name: "@babel/*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # PHPUnit 13 requires PHP 8.4; the extensions still support PHP 8.3.
      - dependency-name: "phpunit/phpunit"
        update-types: ["version-update:semver-major"]
